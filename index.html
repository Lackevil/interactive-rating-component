<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Interactive rating component</title>
    <!-- Styles -->
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>
    <div class="wrapper">
      <section class="rating">
        <div class="rating__star">
          <img
            src="images/icon-star.svg"
            alt="Star icon"
            width="17"
            height="16"
          />
        </div>
        <h1 class="rating__title title">How did we do?</h1>
        <p class="rating__text text">
          Please let us know how we did with your support request. All feedback
          is appreciated to help us improve our offering!
        </p>
        <div class="rating__buttons">
          <button data-rate="1" class="rating__button">1</button>
          <button data-rate="2" class="rating__button">2</button>
          <button data-rate="3" class="rating__button">3</button>
          <button data-rate="4" class="rating__button">4</button>
          <button data-rate="5" class="rating__button">5</button>
        </div>
        <a href="#" class="rating__submit">Submit</a>
      </section>
    </div>
    <!-- Scripts -->
    <script src="scripts/main.js"></script>
  </body>
</html>
